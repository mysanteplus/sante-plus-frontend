<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Santé Plus Services - Administration" />
    <meta property="og:description" content="Gestion des administrateurs Santé Plus Services." />
    <meta property="og:image" content="https://app.mysanteplus.com/assets/images/logo-general-text.png" />
    <meta property="og:url" content="https://app.mysanteplus.com/admin-setup.html" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Santé Plus Services" />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Santé Plus Services - Administration" />
    <meta name="twitter:description" content="Gestion des comptes administrateurs." />
    <meta name="twitter:image" content="https://app.mysanteplus.com/assets/images/logo-general-text.png" />
    <title>Administration - Santé Plus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 to-slate-800 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="w-24 h-24 bg-white rounded-2xl shadow-xl flex items-center justify-center mx-auto mb-4">
                <img src="/assets/images/logo-general-icon.png" class="w-16 h-16 object-contain" alt="Logo">
            </div>
            <h1 class="text-2xl font-black text-white">Santé Plus Services</h1>
            <p class="text-slate-400 text-sm mt-1">Gestion des administrateurs</p>
        </div>

        <!-- Carte de création -->
        <div class="bg-white rounded-2xl shadow-2xl p-6">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-3">
                    <i class="fa-solid fa-user-shield text-emerald-600 text-2xl"></i>
                </div>
                <h2 class="text-xl font-black text-slate-800">Créer un administrateur</h2>
                <p class="text-xs text-slate-400 mt-1">Remplissez les informations ci-dessous</p>
            </div>

            <form id="admin-form" class="space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[10px] font-black text-slate-400 block mb-1">Prénom</label>
                        <input type="text" id="prenom" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm" placeholder="Prénom">
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-slate-400 block mb-1">Nom</label>
                        <input type="text" id="nom" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm" placeholder="Nom">
                    </div>
                </div>
                
                <div>
                    <label class="text-[10px] font-black text-slate-400 block mb-1">Email</label>
                    <input type="email" id="email" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm" placeholder="admin@santeplus.bj">
                </div>
                
                <div>
                    <label class="text-[10px] font-black text-slate-400 block mb-1">Téléphone (optionnel)</label>
                    <input type="tel" id="telephone" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm" placeholder="+229 XX XXX XXX">
                </div>
                
                <div>
                    <label class="text-[10px] font-black text-slate-400 block mb-1">Mot de passe</label>
                    <input type="password" id="password" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm" placeholder="••••••">
                </div>
                
                <div>
                    <label class="text-[10px] font-black text-slate-400 block mb-1">Confirmer le mot de passe</label>
                    <input type="password" id="confirm-password" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm" placeholder="••••••">
                </div>
                
                <button type="submit" class="w-full py-4 bg-emerald-600 text-white rounded-xl font-black text-[10px] uppercase tracking-wider shadow-lg hover:bg-emerald-700 transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-user-plus"></i> Créer l'administrateur
                </button>
            </form>
        </div>

        <!-- Liste des administrateurs existants -->
        <div id="admins-list-container" class="mt-6 bg-white rounded-2xl shadow-2xl p-6 hidden">
            <div class="flex items-center gap-2 mb-4">
                <i class="fa-solid fa-users text-emerald-600"></i>
                <h3 class="font-black text-slate-800 text-sm">Administrateurs existants</h3>
                <span id="admins-count" class="text-[10px] bg-slate-100 px-2 py-0.5 rounded-full">0</span>
            </div>
            <div id="admins-list" class="space-y-2 max-h-64 overflow-y-auto">
                <!-- La liste sera chargée ici -->
            </div>
        </div>
        
        <div class="text-center mt-6">
            <p class="text-[10px] text-slate-500">Page de gestion des administrateurs</p>
        </div>
    </div>

    <script>
        const API_URL = 'https://sante-plus-backend-main.onrender.com/api';
        
        // Charger la liste des administrateurs existants
        async function loadAdminsList() {
            try {
                const response = await fetch(`${API_URL}/admin-users/admins`);
                const admins = await response.json();
                
                const container = document.getElementById('admins-list-container');
                const listDiv = document.getElementById('admins-list');
                const countSpan = document.getElementById('admins-count');
                
                if (admins && admins.length > 0) {
                    container.classList.remove('hidden');
                    countSpan.textContent = admins.length;
                    
                    listDiv.innerHTML = admins.map(admin => `
                        <div class="flex items-center justify-between p-3 bg-slate-50 rounded-xl">
                            <div class="flex-1 min-w-0">
                                <p class="font-bold text-slate-800 text-sm truncate">${admin.prenom || ''} ${admin.nom || ''}</p>
                                <p class="text-[10px] text-slate-400 truncate">${admin.email}</p>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                                <span class="text-[8px] text-emerald-600 font-bold">Admin</span>
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.classList.add('hidden');
                }
            } catch (err) {
                console.error("Erreur chargement admins:", err);
            }
        }
        
        // Charger la liste au chargement de la page
        loadAdminsList();
        
        // Gestion du formulaire
        document.getElementById('admin-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const prenom = document.getElementById('prenom').value.trim();
            const nom = document.getElementById('nom').value.trim();
            const email = document.getElementById('email').value.trim();
            const telephone = document.getElementById('telephone').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            
            if (!email || !password || !nom) {
                Swal.fire({ icon: 'error', title: 'Champs manquants', text: 'Email, nom et mot de passe sont requis' });
                return;
            }
            
            if (password !== confirmPassword) {
                Swal.fire({ icon: 'error', title: 'Erreur', text: 'Les mots de passe ne correspondent pas' });
                return;
            }
            
            if (password.length < 6) {
                Swal.fire({ icon: 'error', title: 'Mot de passe trop court', text: 'Minimum 6 caractères' });
                return;
            }
            
            Swal.fire({ title: 'Création...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });
            
            try {
                const response = await fetch(`${API_URL}/admin-users/create-first-admin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, nom, prenom, telephone })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Administrateur créé !',
                        html: `Compte créé avec succès.<br><br><strong>Email:</strong> ${email}<br><strong>Mot de passe:</strong> ${password}`,
                        confirmButtonText: 'OK',
                        confirmButtonColor: '#10B981'
                    }).then(() => {
                        // Réinitialiser le formulaire
                        document.getElementById('admin-form').reset();
                        // Recharger la liste des admins
                        loadAdminsList();
                    });
                } else {
                    throw new Error(data.error);
                }
            } catch (err) {
                Swal.close();
                Swal.fire({ icon: 'error', title: 'Erreur', text: err.message });
            }
        });
    </script>
</body>
</html>
